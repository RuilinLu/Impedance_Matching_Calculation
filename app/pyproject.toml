[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impedance-matching-ai"
version = "4.3.0"
description = "Impedance Matching AI — microwave impedance matching, Smith chart simulation, textbook search and MCP tools"
readme = { text = "Impedance Matching AI — standalone matching calculator, textbook library and MCP server", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Nova" },
  { name = "Echo" },
  { name = "Iris" },
  { name = "Lumen" },
]
dependencies = [
  "numpy>=1.24",
  "pymupdf>=1.24",
  "pywebview>=6.0; sys_platform == 'win32'",
  "pythonnet>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
attachments = [
  "rapidocr_onnxruntime>=1.2",
  "python-docx>=1.1",
  "python-pptx>=0.6",
  "openpyxl>=3.1",
  "Pillow>=10.0",
]

[project.scripts]
impedance-ai = "impedance_mcp.mcp_server:main"
impedance-app = "impedance_mcp.desktop:main"
impedance-web = "impedance_mcp.web_server:main"
impedance-mcp = "impedance_mcp.mcp_server:main"

[tool.setuptools]
packages = ["impedance_mcp"]

[tool.setuptools.package-data]
impedance_mcp = ["web/*", "docs_content/*.md", "providers.json"]
